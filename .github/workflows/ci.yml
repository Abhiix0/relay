name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  visual:
    name: Visual regression
    # The committed golden PNGs were captured on Windows. Keep the capture OS
    # aligned so platform fonts do not create false visual regressions.
    runs-on: windows-latest
    # Only run on PRs and pushes to main — skip for trivial commits if needed
    needs: ci
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install the pinned Chromium browser (build 1148, Playwright 1.49.1).
      # The visual job uses the golden images' Windows font environment.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build app
        run: pnpm build

      # Start the preview server in the background; wait until it responds
      - name: Start preview server
        run: |
          pnpm preview &
          npx wait-on http://localhost:4173 --timeout 30000

      # Verify authenticated viewport layout & internal scrolling (regression test)
      - name: AppShell scrolling regression test
        run: pnpm test:app-shell

      # Run landing accessibility audit test
      - name: Accessibility audit
        run: pnpm test:a11y

      # Capture current screenshots into baseline/current/
      - name: Capture current screenshots
        run: pnpm test:visual:capture

      # Diff current vs committed golden — exits 1 if any image exceeds 0.1%
      - name: Diff against golden baseline
        run: pnpm test:visual:diff

      # Always upload diff images so failures are reviewable
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: baseline/diff/
          retention-days: 14
